<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>STAY CLEAN - Objednávka</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #ffe4ef; /* světle růžová */
        margin: 0;
        padding: 0;
    }

    .container {
        max-width: 700px;
        margin: 30px auto;
        background: #fff0f6;
        border-radius: 15px;
        padding: 20px 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #d63384;
    }

    .logo {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
    }

    .item {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        padding: 8px;
        border-bottom: 1px solid #f5c2d6;
    }

    input[type="number"] {
        width: 60px;
        padding: 5px;
    }

    .form-group {
        margin: 10px 0;
    }

    input[type="text"], input[type="email"], input[type="tel"] {
        width: 100%;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #f3aac2;
    }

    .total {
        font-size: 20px;
        text-align: right;
        margin-top: 15px;
        font-weight: bold;
        color: #a61e4d;
    }

    button {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        background: #ff66a3;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 15px;
    }

    button:hover {
        background: #e64980;
    }
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <!-- RŮŽOVÉ LOGO -->
        <svg width="120" height="120">
            <circle cx="60" cy="60" r="50" fill="#ffd6e7"/>
            <circle cx="60" cy="60" r="35" fill="#ff99c8"/>
            <text x="60" y="65" text-anchor="middle" font-size="14" fill="#8a0f40" font-weight="bold">
                CLEAN
            </text>
        </svg>
    </div>

    <h1>STAY CLEAN</h1>

    <h3>Kontaktní údaje</h3>

    <div class="form-group">
        <input type="text" id="jmeno" placeholder="Jméno">
    </div>

    <div class="form-group">
        <input type="text" id="prijmeni" placeholder="Příjmení">
    </div>

    <div class="form-group">
        <input type="email" id="email" placeholder="E-mail">
    </div>

    <div class="form-group">
        <input type="tel" id="telefon" placeholder="Telefon">
    </div>

    <h3>Vyber produkty</h3>

    <div class="item">
        <span>GUMOVÉ RUKAVICE (40 Kč)</span>
        <input type="number" min="0" id="rukavice" value="0">
    </div>

    <div class="item">
        <span>HOUBIČKA (20 Kč)</span>
        <input type="number" min="0" id="houbicka" value="0">
    </div>

    <div class="item">
        <span>HADR (35 Kč)</span>
        <input type="number" min="0" id="hadr" value="0">
    </div>

    <div class="item">
        <span>MÝDLO (50 Kč)</span>
        <input type="number" min="0" id="mydlo" value="0">
    </div>

    <div class="item">
        <span>SMETÁK (100 Kč)</span>
        <input type="number" min="0" id="smetak" value="0">
    </div>

    <div class="total">
        Celkem: <span id="celkem">0</span> Kč
    </div>

    <button onclick="odeslatObjednavku()">ODESLAT OBJEDNÁVKU</button>

</div>

<script>

function spocitej() {
    let ceny = {
        rukavice: 40,
        houbicka: 20,
        hadr: 35,
        mydlo: 50,
        smetak: 100
    };

    let celkem = 0;

    for (let produkt in ceny) {
        let pocet = document.getElementById(produkt).value;
        celkem += pocet * ceny[produkt];
    }

    document.getElementById("celkem").innerText = celkem;
}

document.querySelectorAll("input[type=number]").forEach(input => {
    input.addEventListener("input", spocitej);
});

function odeslatObjednavku() {

    let jmeno = document.getElementById("jmeno").value;
    let prijmeni = document.getElementById("prijmeni").value;
    let email = document.getElementById("email").value;
    let telefon = document.getElementById("telefon").value;

    if (!jmeno || !prijmeni || !email || !telefon) {
        alert("Vyplň všechna pole!");
        return;
    }

    let produkty = [
        {nazev:"Rukavice", id:"rukavice"},
        {nazev:"Houbicka", id:"houbicka"},
        {nazev:"Hadr", id:"hadr"},
        {nazev:"Mydlo", id:"mydlo"},
        {nazev:"Smetak", id:"smetak"}
    ];

    let text = "Objednávka STAY CLEAN\n\n";
    text += "Zákazník: " + jmeno + " " + prijmeni + "\n";
    text += "Email: " + email + "\n";
    text += "Telefon: " + telefon + "\n\n";
    text += "Objednané položky:\n";

    let celkem = 0;

    let ceny = {
        rukavice: 40,
        houbicka: 20,
        hadr: 35,
        mydlo: 50,
        smetak: 100
    };

    produkty.forEach(p => {
        let ks = document.getElementById(p.id).value;
        if (ks > 0) {
            text += p.nazev + ": " + ks + " ks\n";
            celkem += ks * ceny[p.id];
        }
    });

    text += "\nCelkem: " + celkem + " Kč";

    let mailto = "mailto:app@kostka-skola.cz"
        + "?subject=Objednávka STAY CLEAN"
        + "&body=" + encodeURIComponent(text);

    window.location.href = mailto;
}

</script>

</body>
</html>
